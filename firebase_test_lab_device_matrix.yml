# Firebase Test Lab Device Matrix Configuration
# This file defines comprehensive device testing matrix for different scenarios

name: Device Matrix Testing

# Device configurations for different test scenarios
device_matrix:
  
  # Popular Android devices for general testing
  popular_devices:
    - model: "Pixel2"
      version: "28"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 2 - Android 9.0"
      
    - model: "Pixel3"
      version: "30"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 3 - Android 11.0"
      
    - model: "Pixel4"
      version: "31"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 4 - Android 12.0"
      
    - model: "Pixel6"
      version: "33"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 6 - Android 13.0"
      
    - model: "j7xelte"
      version: "23"
      locale: "en"
      orientation: "portrait"
      description: "Samsung Galaxy J7 - Android 6.0"

  # Low-end devices for performance testing
  low_end_devices:
    - model: "NexusLowRes"
      version: "25"
      locale: "en"
      orientation: "portrait"
      description: "Low-resolution device - Android 7.1"
      
    - model: "MediumPhone.arm"
      version: "30"
      locale: "en"
      orientation: "portrait"
      description: "Medium-spec ARM device - Android 11.0"

  # High-end devices for performance benchmarking
  high_end_devices:
    - model: "Pixel6"
      version: "33"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 6 - Android 13.0"
      
    - model: "oriole"
      version: "33"
      locale: "en"
      orientation: "portrait"
      description: "Google Pixel 6 Pro - Android 13.0"

  # Tablet devices for responsive design testing
  tablet_devices:
    - model: "Nexus9"
      version: "25"
      locale: "en"
      orientation: "landscape"
      description: "Nexus 9 Tablet - Android 7.1"
      
    - model: "Nexus9"
      version: "25"
      locale: "en"
      orientation: "portrait"
      description: "Nexus 9 Tablet Portrait - Android 7.1"

  # Different Android versions for compatibility testing
  android_versions:
    - model: "Nexus6"
      version: "23"
      locale: "en"
      orientation: "portrait"
      description: "Android 6.0 Marshmallow (API 23)"
      
    - model: "NexusLowRes"
      version: "25"
      locale: "en"
      orientation: "portrait"
      description: "Android 7.1 Nougat (API 25)"
      
    - model: "Pixel2"
      version: "28"
      locale: "en"
      orientation: "portrait"
      description: "Android 9.0 Pie (API 28)"
      
    - model: "Pixel3"
      version: "30"
      locale: "en"
      orientation: "portrait"
      description: "Android 11.0 (API 30)"
      
    - model: "Pixel4"
      version: "31"
      locale: "en"
      orientation: "portrait"
      description: "Android 12.0 (API 31)"
      
    - model: "Pixel6"
      version: "33"
      locale: "en"
      orientation: "portrait"
      description: "Android 13.0 (API 33)"

  # Different screen sizes and densities
  screen_variations:
    - model: "NexusLowRes"
      version: "25"
      locale: "en"
      orientation: "portrait"
      description: "Low resolution screen"
      
    - model: "Pixel2"
      version: "28"
      locale: "en"
      orientation: "portrait"
      description: "Standard resolution screen"
      
    - model: "Pixel6"
      version: "33"
      locale: "en"
      orientation: "portrait"
      description: "High resolution screen"
      
    - model: "Nexus9"
      version: "25"
      locale: "en"
      orientation: "landscape"
      description: "Tablet large screen"

  # Orientation testing
  orientation_tests:
    - model: "Pixel3"
      version: "30"
      locale: "en"
      orientation: "portrait"
      description: "Portrait orientation"
      
    - model: "Pixel3"
      version: "30"
      locale: "en"
      orientation: "landscape"
      description: "Landscape orientation"

  # Locale and language testing
  locale_tests:
    - model: "Pixel3"
      version: "30"
      locale: "en"
      orientation: "portrait"
      description: "English locale"
      
    - model: "Pixel3"
      version: "30"
      locale: "id"
      orientation: "portrait"
      description: "Indonesian locale"
      
    - model: "Pixel3"
      version: "30"
      locale: "ar"
      orientation: "portrait"
      description: "Arabic locale (RTL)"

# Test suite configurations
test_suites:
  
  # Quick smoke tests
  smoke:
    timeout: "10m"
    devices: "popular_devices"
    tests:
      - "integration_test/test_flows/auth_flow_test.dart"
    
  # Comprehensive functional tests
  comprehensive:
    timeout: "20m"
    devices: "popular_devices"
    tests:
      - "integration_test/test_flows/auth_flow_test.dart"
      - "integration_test/test_flows/document_flow_test.dart"
      - "integration_test/test_flows/navigation_flow_test.dart"
    
  # Performance tests
  performance:
    timeout: "30m"
    devices: "high_end_devices,low_end_devices"
    tests:
      - "integration_test/test_flows/performance_test.dart"
    environment_variables:
      - "performance_test=true"
      - "memory_profiling=true"
    
  # Compatibility tests
  compatibility:
    timeout: "25m"
    devices: "android_versions"
    tests:
      - "integration_test/test_flows/auth_flow_test.dart"
      - "integration_test/test_flows/document_flow_test.dart"
    
  # Responsive design tests
  responsive:
    timeout: "15m"
    devices: "screen_variations,tablet_devices"
    tests:
      - "integration_test/test_flows/navigation_flow_test.dart"
    
  # Orientation tests
  orientation:
    timeout: "15m"
    devices: "orientation_tests"
    tests:
      - "integration_test/test_flows/navigation_flow_test.dart"
    
  # Localization tests
  localization:
    timeout: "20m"
    devices: "locale_tests"
    tests:
      - "integration_test/test_flows/auth_flow_test.dart"

# Test execution strategies
execution_strategies:
  
  # Parallel execution for faster results
  parallel:
    max_concurrent: 10
    fail_fast: false
    
  # Sequential execution for debugging
  sequential:
    max_concurrent: 1
    fail_fast: true
    
  # Balanced execution
  balanced:
    max_concurrent: 5
    fail_fast: false

# Result configurations
results:
  bucket: "gs://your-project-test-results"
  retention_days: 30
  
  # Result formats
  formats:
    - junit_xml
    - json
    - html_report
    
  # Artifacts to collect
  artifacts:
    - screenshots
    - videos
    - logs
    - performance_metrics
    - coverage_reports

# Notification settings
notifications:
  slack:
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channels:
      - "#testing"
      - "#mobile-dev"
    
  email:
    recipients:
      - "dev-team@company.com"
      - "qa-team@company.com"
    
  github:
    create_issue_on_failure: true
    assign_to: ["@mobile-team"]

# Environment configurations
environments:
  development:
    firebase_project: "your-dev-project"
    test_data: "dev_test_data"
    
  staging:
    firebase_project: "your-staging-project"
    test_data: "staging_test_data"
    
  production:
    firebase_project: "your-prod-project"
    test_data: "prod_test_data"

# Custom test configurations
custom_configs:
  
  # Memory stress testing
  memory_stress:
    devices: ["Pixel6", "NexusLowRes"]
    environment_variables:
      - "memory_stress_test=true"
      - "large_dataset=true"
    timeout: "45m"
    
  # Network condition testing
  network_conditions:
    devices: ["Pixel3"]
    network_profiles:
      - "2G-GSM"
      - "3G-HSPA"
      - "4G-LTE"
      - "WIFI"
    timeout: "35m"
    
  # Battery optimization testing
  battery_tests:
    devices: ["Pixel4", "Pixel6"]
    environment_variables:
      - "battery_test=true"
      - "background_processing=true"
    timeout: "60m"

# Reporting configurations
reporting:
  dashboard_url: "https://your-dashboard.com/test-results"
  
  metrics:
    - test_duration
    - success_rate
    - device_coverage
    - performance_benchmarks
    - memory_usage
    - crash_rate
    
  alerts:
    success_rate_threshold: 95
    performance_regression_threshold: 20
    memory_leak_threshold: 100MB
