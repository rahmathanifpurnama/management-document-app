# Firebase Test Lab iOS Configuration
# This file defines the test matrix for iOS devices

# Test matrix configuration
test_matrix:
  # Device configurations
  devices:
    - model: "iphone13pro"
      version: "15.7"
      locale: "en"
      orientation: "portrait"
    - model: "iphone14"
      version: "16.6"
      locale: "en"
      orientation: "portrait"
    - model: "iphone14pro"
      version: "16.6"
      locale: "en"
      orientation: "portrait"
    - model: "iphone15"
      version: "17.2"
      locale: "en"
      orientation: "portrait"
    - model: "ipad10"
      version: "16.6"
      locale: "en"
      orientation: "portrait"

  # Test configurations
  test_configurations:
    - name: "smoke_tests"
      description: "Basic smoke tests for core functionality"
      test_targets:
        - "integration_test/test_flows/auth_flow_test.dart"
        - "integration_test/test_flows/navigation_flow_test.dart"
      timeout: "15m"
      
    - name: "document_tests"
      description: "Document management functionality tests"
      test_targets:
        - "integration_test/test_flows/document_flow_test.dart"
      timeout: "20m"
      
    - name: "user_management_tests"
      description: "User management functionality tests"
      test_targets:
        - "integration_test/test_flows/user_management_flow_test.dart"
      timeout: "15m"
      
    - name: "category_tests"
      description: "Category management functionality tests"
      test_targets:
        - "integration_test/test_flows/category_flow_test.dart"
      timeout: "15m"
      
    - name: "performance_tests"
      description: "Performance and stress tests"
      test_targets:
        - "integration_test/test_flows/performance_test.dart"
      timeout: "30m"
      
    - name: "full_suite"
      description: "Complete test suite"
      test_targets:
        - "integration_test/app_test.dart"
      timeout: "45m"

# Environment variables
environment_variables:
  FLUTTER_TEST: "true"
  TEST_ENV: "firebase_test_lab"
  ENABLE_PERFORMANCE_TESTS: "true"
  ENABLE_CLOUD_FUNCTION_TESTS: "true"

# Test execution settings
execution_settings:
  # Maximum test execution time
  timeout: "60m"
  
  # Number of test shards (parallel execution)
  num_shards: 1
  
  # Test result storage
  results_bucket: "gs://your-project-test-results"
  
  # Video recording
  record_video: true
  
  # Performance monitoring
  performance_metrics: true
  
  # Network profiles
  network_profiles:
    - "LTE"
    - "3G"
    - "WIFI"

# iOS-specific configurations
ios_specific_configs:
  # Xcode version
  xcode_version: "15.0"
  
  # iOS deployment target
  deployment_target: "12.0"
  
  # Provisioning profiles
  provisioning_profiles:
    development: "Development_Profile.mobileprovision"
    distribution: "Distribution_Profile.mobileprovision"
  
  # Code signing
  code_signing:
    team_id: "YOUR_TEAM_ID"
    signing_identity: "iPhone Developer"
  
  # Entitlements
  entitlements:
    - "com.apple.developer.icloud-container-identifiers"
    - "com.apple.developer.ubiquity-kvstore-identifier"

# Device-specific configurations
device_specific_configs:
  iphone13pro:
    # Specific settings for iPhone 13 Pro
    additional_frameworks: []
    system_features: []
    
  iphone14:
    # Specific settings for iPhone 14
    additional_frameworks: []
    system_features: []
    
  iphone14pro:
    # Specific settings for iPhone 14 Pro
    additional_frameworks: []
    system_features: []
    
  ipad10:
    # Specific settings for iPad (10th generation)
    additional_frameworks: []
    system_features: []
    orientation_tests: ["portrait", "landscape"]

# Test data and assets
test_assets:
  # Test files to upload
  test_files:
    - "test_assets/sample_document.pdf"
    - "test_assets/sample_image.jpg"
    - "test_assets/sample_spreadsheet.xlsx"
  
  # Mock data
  mock_data:
    users: "test_data/mock_users.json"
    documents: "test_data/mock_documents.json"
    categories: "test_data/mock_categories.json"

# Reporting configuration
reporting:
  # Test result formats
  formats:
    - "junit"
    - "html"
    - "json"
  
  # Screenshot capture
  screenshots:
    on_failure: true
    on_success: false
    
  # Performance reports
  performance_reports: true
  
  # Coverage reports
  coverage_reports: false

# Retry configuration
retry_config:
  # Maximum number of retries for failed tests
  max_retries: 2
  
  # Retry only on specific failure types
  retry_on:
    - "infrastructure_failure"
    - "timeout"
  
  # Don't retry on these failure types
  no_retry_on:
    - "test_failure"
    - "compilation_error"

# Notification settings
notifications:
  # Email notifications
  email:
    enabled: true
    recipients:
      - "dev-team@yourcompany.com"
    on_failure: true
    on_success: false
  
  # Slack notifications
  slack:
    enabled: false
    webhook_url: ""
    channel: "#test-results"

# Cost optimization
cost_optimization:
  # Use only necessary device configurations
  minimal_device_set: false
  
  # Terminate tests early on critical failures
  fail_fast: true
  
  # Use spot instances when available
  use_spot_instances: true

# Security settings
security:
  # Disable network access for specific tests
  network_isolation: false
  
  # Use test-specific Firebase project
  test_project_id: "your-test-project-id"
  
  # Encrypt test data
  encrypt_test_data: true

# Custom test runner settings
test_runner:
  # Flutter test runner configuration
  flutter_test_args:
    - "--coverage"
    - "--reporter=json"
    - "--timeout=30m"
  
  # Additional Dart VM arguments
  dart_vm_args:
    - "--enable-asserts"
    - "--observe"
  
  # Test selection patterns
  test_patterns:
    include:
      - "integration_test/**/*_test.dart"
    exclude:
      - "integration_test/**/*_manual_test.dart"

# Debugging settings
debugging:
  # Enable debug logging
  debug_logging: true
  
  # Capture system logs
  system_logs: true
  
  # Enable test debugging
  test_debugging: false
  
  # Remote debugging
  remote_debugging: false

# iOS Simulator settings
simulator_settings:
  # Hardware keyboard
  hardware_keyboard: false
  
  # Device appearance
  appearance: "light"
  
  # Accessibility settings
  accessibility:
    voice_over: false
    zoom: false
    invert_colors: false
    
  # Location services
  location_services: true
  
  # Push notifications
  push_notifications: true

# Performance testing specific to iOS
ios_performance:
  # Memory pressure testing
  memory_pressure: true
  
  # CPU throttling
  cpu_throttling: false
  
  # Battery simulation
  battery_simulation: true
  
  # Thermal state simulation
  thermal_state: "nominal"

# App Store Connect integration
app_store_connect:
  # TestFlight integration
  testflight_enabled: false
  
  # App Store review guidelines compliance
  compliance_checks: true
  
  # Privacy manifest validation
  privacy_manifest_validation: true
