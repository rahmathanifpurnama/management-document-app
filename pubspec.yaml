name: managementdoc
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_app_check: ^0.3.2+7

  # State Management - Hybrid Architecture
  flutter_riverpod: ^2.4.9
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Local Storage
  shared_preferences:
    ^2.2.2

    # Gunakan file_selector (plugin resmi Flutter)
  file_selector: ^1.0.1

  # Pastikan semua platform didukung
  file_selector_linux: ^0.9.2
  file_selector_macos: ^0.9.3
  file_selector_windows: ^0.9.3
  file_selector_web: ^0.9.1
  file_selector_ios: ^0.5.3+1
  file_selector_android: ^0.5.0
  path_provider: ^2.1.1
  image_picker: ^1.0.4

  # UI & Utils
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  permission_handler: ^11.1.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  uuid: ^4.2.1
  path: ^1.8.3

  # File Download
  dio: ^5.4.0
  external_path: ^2.2.0

  # Native Notifications
  flutter_local_notifications: ^17.2.3

  # HTTP Client for Cloud Functions
  http: ^1.1.0

  # Cloud Functions
  cloud_functions: ^5.1.3

  # Connectivity
  connectivity_plus: ^6.0.5

  # Cryptography for file hashing
  crypto: ^3.0.3

  # Google Drive integration
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1

  # Native sharing functionality (simplified)
  share_plus: ^10.1.2

  # File Preview Dependencies
  flutter_pdfview: ^1.3.2
  webview_flutter: ^4.4.2
  photo_view: ^0.14.0
  video_player: ^2.8.1
  audioplayers: ^5.2.1
  url_launcher: ^6.3.1
  firebase_messaging: ^15.1.3
  lottie: ^3.3.0

  # Charts and Data Visualization
  fl_chart: ^1.0.0

  # Excel Export
  excel: ^2.1.0

  # Archive for ZIP creation
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration Testing
  integration_test:
    sdk: flutter

  # Firebase Testing Mocks
  fake_cloud_firestore: ^3.0.3
  firebase_storage_mocks: ^0.7.0
  firebase_auth_mocks: ^0.14.1
  mockito: ^5.4.4
  build_runner: ^2.4.13

  # Code Generation for Riverpod + BLoC
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true  # Generate Android icons
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#F5F5F5"
    theme_color: "#1976D2"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  linux:
    generate: true
    image_path: "assets/app_icon.png"

  # Main app icon
  image_path: "assets/app_icon.png"

  # Disable adaptive icon to prevent zoom issues
  # adaptive_icon_background: "#F5F5F5"
  # adaptive_icon_foreground: "assets/app_icon.png"

  # Minimum SDK version
  min_sdk_android: 21

  # Remove old launcher icons
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/icon/
    # Navigation icons (corrected case sensitivity)
    - assets/icon/Home.svg              # Actual file name (uppercase H)
    - assets/icon/home-filled.svg       # Home filled state
    - assets/icon/folder.svg            # Category icon
    - assets/icon/folder-filled.svg     # Category filled state
    - assets/icon/add-user.svg          # Add user icon
    - assets/icon/add-user-filled.svg   # Add user filled state
    - assets/icon/user.svg              # User/Profile icon
    - assets/icon/user-filled.svg       # User/Profile filled state
    # Additional icons
    - assets/icon/user-folder.svg       # User folder icon
    - assets/icon/recycle-bin.svg       # Recycle bin icon
    - assets/icon/plus.svg              # Plus/Add icon
    - assets/icon/Activity.svg          # Activity icon
    - assets/icon/fillter.svg           # Filter icon
    # App assets
    - assets/app_icon.png
    - assets/Logo.svg
    - assets/animation/
    - assets/animation/bell.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package


